[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picard-enterprise"
version = "0.1.0"
description = "Exact and certified computations for Picard modular groups"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/picard_enterprise"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
sage = "10.9.*"
pytest = "*"
ruff = "*"
pyright = "*"
jupytext = ">=1.19.5,<2"

[tool.pixi.pypi-dependencies]
picard-enterprise = { path = ".", editable = true }

[tool.pixi.activation.env]
JUPYTER_CONFIG_DIR = ".jupyter-data/config"
JUPYTER_DATA_DIR = ".jupyter-data/data"
JUPYTER_RUNTIME_DIR = ".jupyter-data/runtime"

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "pyright"
course-sync = "jupytext --sync"
course-check = "jupytext --to ipynb --test-strict"
course-execute = "jupyter execute --inplace --timeout=120"
course-lab = "jupyter lab"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = ".pixi/envs"
venv = "default"
